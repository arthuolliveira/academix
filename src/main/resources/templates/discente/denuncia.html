<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Academix - Canal de Denúncias</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<div class="layout">

    <!-- Menu lateral -->
    <div th:replace="~{fragmentos :: menuDiscente('denuncia')}"></div>

    <main class="conteudo">
        <h1>Canal de Denúncias</h1>
        <p class="subtitulo">Registre uma ocorrência para a ouvidoria da instituição.</p>

        <div class="cartao">
            <h2>Nova denúncia</h2>
            <label for="tipo">Tipo de ocorrência</label>
            <select id="tipo">
                <option>Assédio</option>
                <option>Infraestrutura</option>
                <option>Conduta docente</option>
                <option>Outros</option>
            </select>
            <label for="descricao">Descreva o ocorrido</label>
            <textarea id="descricao"></textarea><br>
            <label class="opcao-radio"><input type="checkbox" checked> Enviar de forma anônima</label><br>
            <button type="button" class="botao">Enviar denúncia</button>
        </div>

        <div class="cartao">
            <h2>Minhas denúncias</h2>
            <table>
                <tr><th>Protocolo</th><th>Tipo</th><th>Data</th><th>Situação</th></tr>
                <tr><td>DEN-2026-0012</td><td>Infraestrutura</td><td>14/10/2026</td><td class="situacao-alerta">Em análise</td></tr>
            </table>
        </div>
    </main>
</div>
</body>
</html>
