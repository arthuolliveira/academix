# ===== Nome da aplicação =====
spring.application.name=academix

# ===== Conexão com o PostgreSQL (banco local "academix") =====
spring.datasource.url=jdbc:postgresql://localhost:5432/academix
spring.datasource.username=postgres
spring.datasource.password=postgres

# ===== JPA / Hibernate =====
# update = cria/atualiza as tabelas automaticamente a partir das classes @Entity
spring.jpa.hibernate.ddl-auto=update
# mostra no console o SQL gerado (ótimo para explicar na apresentação)
spring.jpa.show-sql=true

# ===== Thymeleaf =====
# cache desligado: alterações nos HTML aparecem sem reiniciar
spring.thymeleaf.cache=false
